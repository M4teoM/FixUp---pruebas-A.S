name: Infrastructure CI

on:
  pull_request:
    branches: [develop]
    paths:
      - compose.local.yml
      - .env.example
      - .gitignore
      - .gitattributes
      - scripts/**
      - .github/workflows/infrastructure-ci.yml
  push:
    branches: [develop]
    paths:
      - compose.local.yml
      - .env.example
      - .gitignore
      - .gitattributes
      - scripts/**
      - .github/workflows/infrastructure-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tracked files without exposing secrets
        shell: pwsh
        run: ./scripts/check-sensitive-files.ps1
      - name: Validate Compose with local placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env -f compose.local.yml config --quiet
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Output $_.Message }
              throw "Invalid syntax: $($file.Name)"
            }
          }
