# Umbrales del APDEX alineados con RNF-01 (p95 <= 3 s). Los valores de fábrica de JMeter son
# 500 ms y 1500 ms, que no corresponden a ningún requisito de este proyecto y hacen que la
# búsqueda de 50 km aparezca con un índice de 0,51 cuando en realidad cumple de sobra.
#
# Se pasan con -q porque -J no alcanza al generador de informes:
#   jmeter -g perf\.work\rnf01.jtl -o perf\.work\informe-rnf01-ok -q perf\jmeter\informe-rnf01.properties
jmeter.reportgenerator.apdex_satisfied_threshold=3000
jmeter.reportgenerator.apdex_tolerated_threshold=5000
