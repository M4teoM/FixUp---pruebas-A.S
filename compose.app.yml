# Maquina B — nodo de aplicacion: API y PWA.
#
# La base de datos NO esta aqui: DATABASE_URL apunta a ${DATA_HOST}, la maquina A.
# Se inicia con scripts/start-distributed.sh, que ademas levanta la maquina A por SSH.
name: ${COMPOSE_PROJECT_NAME:-fixup-dist}-app

services:
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../fixup-backend}
      dockerfile: Dockerfile
    image: fixup-backend:dist
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # El unico cambio real frente al despliegue en una sola maquina.
      DATABASE_URL: jdbc:postgresql://${DB_HOST:-${DATA_HOST:?DATA_HOST is required}}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # El backend valida los tokens con las llaves publicas del emisor; por defecto, las de Auth0.
      AUTH0_JWK_SET_URI: ${AUTH0_JWK_SET_URI:-${AUTH0_ISSUER_URI}.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Almacen de objetos en el nodo de datos. ENDPOINT lo usa el backend; PUBLIC_ENDPOINT es el
      # que escribe en las URLs firmadas y, por tanto, el que debe alcanzar el navegador.
      FIXUP_STORAGE_ENDPOINT: http://${DB_HOST:-${DATA_HOST}}:${STORAGE_PORT:-9000}
      FIXUP_STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://${DATA_HOST}:${STORAGE_PORT:-9000}}
      FIXUP_STORAGE_ACCESS_KEY: ${FIXUP_STORAGE_ACCESS_KEY:-fixup}
      FIXUP_STORAGE_SECRET_KEY: ${FIXUP_STORAGE_SECRET_KEY:-development-only-secret}
      # Datos de demostración de Colombia (DemoDataSeedRunner). Apagados salvo que el .env los pida;
      # los subjects ligan las cuentas protagonistas a usuarios reales de Auth0.
      FIXUP_SEED_ENABLED: ${FIXUP_SEED_ENABLED:-false}
      FIXUP_SEED_OWNER_SUBJECT: ${FIXUP_SEED_OWNER_SUBJECT:-auth0|demo-owner}
      FIXUP_SEED_TENANT_SUBJECT: ${FIXUP_SEED_TENANT_SUBJECT:-auth0|demo-tenant}
      FIXUP_SEED_FIXER_SUBJECT: ${FIXUP_SEED_FIXER_SUBJECT:-auth0|demo-fixer}
      FIXUP_SEED_MANAGER_SUBJECT: ${FIXUP_SEED_MANAGER_SUBJECT:-auth0|demo-real_estate_manager}
      FIXUP_SEED_ADMIN_SUBJECT: ${FIXUP_SEED_ADMIN_SUBJECT:-auth0|demo-platform_admin}
    ports:
      - "${APP_BIND:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      # Permite usar el nombre logico fixup-data aunque DATA_HOST sea una IP.
      - "fixup-data:${DATA_HOST}"

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../fixup-frontend}
      dockerfile: Dockerfile
    image: fixup-frontend:dist
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_started
